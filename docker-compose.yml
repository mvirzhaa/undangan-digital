services:
  db:
    image: postgres:16-alpine
    container_name: undangan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undanganuika2026}
      POSTGRES_DB: ${POSTGRES_DB:-undangan_digital}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: undangan-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3006
      DATABASE_URL: postgres://${POSTGRES_USER:-undangan}:${POSTGRES_PASSWORD:-undanganuika2026}@db:5432/${POSTGRES_DB:-undangan_digital}
      JWT_SECRET: ${JWT_SECRET:-undangan-digital-jwt-secret-uika-2026-minimal-32-karakter}
      BASE_URL: ${BASE_URL:-https://utility.uika-bogor.ac.id/undangan-digital}
      BASE_PATH: ${BASE_PATH:-/undangan-digital}
      NODE_ENV: production
    ports:
      - "3006:3006"
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  pgdata:
